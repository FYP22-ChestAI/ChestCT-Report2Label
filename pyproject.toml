[project]
name = "report2label"
version = "0.1.0"
description = "Extraction of CT-RATE-compatible multi-abnormality labels from chest CT radiology reports."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "torch>=2.1",
    "transformers>=4.38",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "pdfplumber>=0.10",
    "python-docx>=1.1",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
notebooks = ["jupyterlab>=4.0", "ipykernel>=6.29", "nbconvert>=7.16"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
