# Multi-abnormality label set, in the exact order the RadBertClassifier
# classification head was trained on. Order matters: it must match the
# checkpoint's output dimension index-for-index.
labels:
  - name: "Medical material"
    description: "Lines, tubes, catheters, valves, or other implanted/inserted material."
  - name: "Arterial wall calcification"
    description: "Calcification of the aortic or other arterial walls."
  - name: "Cardiomegaly"
    description: "Enlarged cardiac silhouette."
  - name: "Pericardial effusion"
    description: "Fluid within the pericardial sac."
  - name: "Coronary artery wall calcification"
    description: "Calcification along the coronary arteries."
  - name: "Hiatal hernia"
    description: "Herniation of abdominal contents through the diaphragmatic hiatus."
  - name: "Lymphadenopathy"
    description: "Enlarged mediastinal, hilar, or axillary lymph nodes."
  - name: "Emphysema"
    description: "Destruction of lung parenchyma with airspace enlargement."
  - name: "Atelectasis"
    description: "Partial or complete lung collapse."
  - name: "Lung nodule"
    description: "Focal pulmonary nodule(s)."
  - name: "Lung opacity"
    description: "Non-specific parenchymal opacity."
  - name: "Pulmonary fibrotic sequela"
    description: "Fibrotic bands or architectural distortion from prior lung injury."
  - name: "Pleural effusion"
    description: "Fluid within the pleural space."
  - name: "Mosaic attenuation pattern"
    description: "Mosaic pattern of lung attenuation, often reflecting air trapping or small airways disease."
  - name: "Peribronchial thickening"
    description: "Thickening of the bronchial walls."
  - name: "Consolidation"
    description: "Airspace consolidation."
  - name: "Bronchiectasis"
    description: "Irreversible bronchial dilation."
  - name: "Interlobular septal thickening"
    description: "Thickening of the interlobular septa."
